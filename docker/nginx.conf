# nginx server config for serving the built React/Vite single-page app.
#
# This file overwrites the stock /etc/nginx/conf.d/nginx.default.conf that
# ships in the Chainguard nginx image. The base image's top-level
# /etc/nginx/nginx.conf is kept as-is; it `include`s /etc/nginx/conf.d/*.conf,
# so dropping this file there is all that is needed.
#
# Notes:
#  - The image runs as the nonroot user (uid 65532) and the stock config
#    listens on 8080, so no privileged port / root is required.
#  - Access/error logs go to stdout/stderr so `docker logs` / the container
#    runtime collects them (the default file paths under /var/log/nginx are
#    not writable by the nonroot user).

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    access_log /dev/stdout;
    error_log  /dev/stderr;

    # Long-cache the content-hashed build assets Vite emits under /assets/.
    # Their filenames change on every build, so they are safe to cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routing (React Router) means deep links like
    # /users or /logs/connection have no file on disk — serve index.html and
    # let the router resolve the path. index.html itself must never be cached
    # so a new deploy is picked up immediately.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Health endpoint for container/orchestrator probes.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
